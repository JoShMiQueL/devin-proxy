name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check devin_proxy tests
      - name: Tests (unit)
        run: pytest -q -m "not live"

      - name: Tests (live, needs DEVIN_PROXY_API_KEY secret)
        if: ${{ secrets.DEVIN_PROXY_API_KEY != '' }}
        env:
          DEVIN_PROXY_API_KEY: ${{ secrets.DEVIN_PROXY_API_KEY }}
        run: pytest -q tests/test_live.py -v
