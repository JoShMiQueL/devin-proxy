name: Publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version $VERSION"

  test:
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test

  publish:
    needs: [verify-tag, test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: npm install -g npm@latest
      - run: |
          npm run typecheck
          npm run build
      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (trusted publishing)
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance
