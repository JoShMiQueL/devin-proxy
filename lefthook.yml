# Git hooks — run ruff + unit tests on every commit/push.
# Install once:  pip install lefthook && lefthook install
#   (the dev extra already ships it: pip install -e ".[dev]")
#
# Hooks run via Git's sh.exe on Windows — `.venv` isn't on PATH inside a
# hook, so point at it explicitly. Override with LEFTHOOK_PY if the dev
# env lives elsewhere.

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.py"
      run: ruff check --fix {staged_files} && git add {staged_files}
    tests:
      glob: "{devin_proxy,tests}/**.py"   # only when python changes
      run: ./.venv/Scripts/python -m pytest -q -m 'not live' --no-header -x

pre-push:
  commands:
    tests:
      run: ./.venv/Scripts/python -m pytest -q -m 'not live'
    lint:
      run: ruff check devin_proxy tests scripts
